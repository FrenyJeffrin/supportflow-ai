services:

  postgres:
    image: postgres:17
    container_name: supportflow-postgres

    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: supportflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U supportflow -d supportflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: