services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: supportflow-postgres

    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: supportflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U supportflow -d supportflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    container_name: supportflow-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: